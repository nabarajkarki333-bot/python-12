<body>
    <p>preタグ (Preformatted Text)</p>

    <pre>
・整形済みテキストを表示するタグです。
・preタグで囲まれたテキストは、改行や連続した空白を保って表示されます。
・preタグの中にHTMLタグを記述すると、そのタグは通常どおり解釈されます。
  タグを文字として表示したい場合は、&amp;lt; や &amp;gt; のようにエスケープします。
・例:
&lt;pre&gt;
    この間の文は、改行や空白を保って表示されます。
&lt;/pre&gt;
    </pre>
</body>
